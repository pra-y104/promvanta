<style>
:root{
  --primary:#635bff;
  --primary2:#7c3aed;
  --dark:#17172b;
  --text:#25253a;
  --muted:#74748a;
  --bg:#f7f7fc;
  --card:#fff;
  --border:#e9e9f2;
  --success:#159957;
  --warning:#d58b00;
  --danger:#dc3545;
  --shadow:0 12px 35px rgba(31,31,71,.08);
  --radius:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
.container{width:min(1160px,calc(100% - 36px));margin:auto}
.hidden{display:none!important}
.btn{border:0;border-radius:11px;padding:13px 19px;font-weight:700;transition:.2s}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;box-shadow:0 8px 20px rgba(99,91,255,.22)}
.btn-light{background:#f1f1fa;color:var(--text)}
.btn-outline{background:white;border:1px solid var(--border);color:var(--text)}
.btn-danger{background:#fff0f1;color:var(--danger)}
.btn-success{background:#eaf8f1;color:var(--success)}
.navbar{height:76px;background:rgba(255,255,255,.94);backdrop-filter:blur(15px);border-bottom:1px solid var(--border);display:flex;align-items:center;position:sticky;top:0;z-index:50}
.nav-inner{display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:900;letter-spacing:-.8px;font-size:22px;color:var(--dark)}
.logo span{color:var(--primary)}
.nav-links{display:flex;gap:27px;color:#5f6074;font-size:14px;font-weight:600}
.nav-actions{display:flex;gap:10px;align-items:center}
.menu{display:none;border:0;background:none;font-size:25px}
.hero{padding:90px 0 70px;background:radial-gradient(circle at 80% 20%,rgba(124,58,237,.12),transparent 34%),linear-gradient(180deg,#fff,#f7f7fc)}

.badge{display:inline-flex;padding:8px 13px;background:#eeedff;color:#5b52df;border-radius:30px;font-weight:800;font-size:12px;margin-bottom:20px}
.hero h1{font-size:clamp(42px,6vw,70px);line-height:1.02;letter-spacing:-3px;margin:0 0 22px;color:var(--dark)}
.hero h1 span{background:linear-gradient(135deg,var(--primary),var(--primary2));-webkit-background-clip:text;color:transparent}
.hero p{font-size:18px;line-height:1.7;color:var(--muted);max-width:650px}
.hero-actions{display:flex;gap:12px;margin:30px 0}
.trust{font-size:13px;color:#68687b;font-weight:700}
.trust strong{color:var(--success)}
.hero-card{background:white;border:1px solid var(--border);border-radius:25px;padding:22px;box-shadow:var(--shadow);transform:rotate(1deg)}
.demo-label{font-size:10px;letter-spacing:1px;font-weight:900;color:#9b5c00;background:#fff4dc;padding:5px 8px;border-radius:5px;display:inline-block}

.dash-title{font-weight:850;font-size:18px}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#e9e7ff;color:var(--primary);font-weight:900}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.stat{background:#f8f8fc;padding:15px;border-radius:14px}
.stat small{color:var(--muted);display:block;margin-bottom:8px}
.stat strong{font-size:20px}
.chart{height:150px;margin-top:15px;border-radius:14px;background:linear-gradient(180deg,#f5f3ff,#fff);position:relative;overflow:hidden}

section{padding:80px 0}
.section-head{text-align:center;max-width:690px;margin:0 auto 42px}

.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:17px}

.price-card{background:white;border:1px solid var(--border);border-radius:22px;padding:28px}
.price-card.featured{border:2px solid var(--primary);box-shadow:var(--shadow)}
.price{font-size:34px;font-weight:900;margin:12px 0}
.price-card ul{list-style:none;padding:0;color:var(--muted);line-height:2}
.faq{max-width:800px;margin:auto}
.faq-item{background:white;border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden}
.faq-q{padding:18px;font-weight:800;display:flex;justify-content:space-between;cursor:pointer}
.faq-a{padding:0 18px 18px;color:var(--muted);line-height:1.6;display:none}
.faq-item.open .faq-a{display:block}
.cta{background:linear-gradient(135deg,#19182d,#30276d);color:white;border-radius:28px;padding:55px;text-align:center}

footer{background:#17172b;color:#b8b7c9;padding:55px 0}

.footer-title{color:white;font-weight:900;margin-bottom:16px}
.footer-links{display:grid;gap:10px;font-size:13px}
.footer-bottom{border-top:1px solid #323148;margin-top:35px;padding-top:20px;font-size:12px}

/* APP */
.app{min-height:100vh}

.sidebar{width:245px;background:white;border-right:1px solid var(--border);position:fixed;left:0;top:0;bottom:0;padding:22px 15px;z-index:40}

.page{padding:30px;max-width:1250px;margin:auto}

.table{width:100%;border-collapse:collapse}
.table th,.table td{text-align:left;padding:13px 8px;border-bottom:1px solid var(--border);font-size:12px}
.table th{color:var(--muted)}
.status{display:inline-flex;padding:5px 8px;border-radius:20px;font-size:10px;font-weight:800}
.status.green{background:#eaf8f1;color:var(--success)}
.status.orange{background:#fff5df;color:var(--warning)}
.status.gray{background:#f0f0f5;color:#777}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}
.field{display:grid;gap:7px;margin-bottom:16px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:800}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:13px;background:#fff;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px #eeedff}
.help{font-size:11px;color:var(--muted)}
.price-box{background:#f7f6ff;border:1px solid #e5e2ff;border-radius:15px;padding:20px;margin:10px 0 20px}
.price-line{display:flex;justify-content:space-between;margin:8px 0;font-size:13px}
.price-total{font-size:22px;font-weight:900;border-top:1px solid #ddd9ff;padding-top:12px;margin-top:12px}
.stepper{display:flex;gap:7px;margin-bottom:25px}
.step-pill{padding:7px 11px;border-radius:20px;background:#eeeef5;color:#777;font-size:11px;font-weight:800}

.success-box{padding:18px;background:#eaf8f1;color:#176c45;border-radius:13px}
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:25px;background:linear-gradient(135deg,#f8f7ff,#fff)}

.auth-card p{color:var(--muted);font-size:13px;line-height:1.6}
.auth-actions{display:grid;gap:10px;margin-top:20px}
.toast{position:fixed;right:20px;bottom:20px;background:#19182d;color:white;padding:14px 18px;border-radius:11px;box-shadow:var(--shadow);z-index:100;max-width:330px;font-size:13px}
.modal-bg{position:fixed;inset:0;background:rgba(15,15,35,.45);display:grid;place-items:center;z-index:90;padding:20px}
.modal{background:white;border-radius:20px;padding:25px;width:min(500px,100%);box-shadow:var(--shadow)}
.modal h2{margin-top:0}
.profile-row{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);font-size:13px}
@media(max-width:900px){

 .sidebar{transform:translateX(-100%);transition:.25s}.sidebar.open{transform:translateX(0)}
 .main{margin-left:0;width:100%}.mobile-menu{display:block;border:0;background:none;font-size:22px}
 .stats{grid-template-columns:1fr 1fr}.app-grid{grid-template-columns:1fr}
 .footer-grid{grid-template-columns:1fr}

@media(max-width:600px){

 section{padding:60px 0}.page{padding:20px 14px}.app-top{padding:0 15px}
 .page-title{align-items:flex-start;gap:12px;flex-direction:column}

</style>
</head>

function money(n){
 return "₦"+Number(n||0).toLocaleString("en-NG",{
  minimumFractionDigits:2,
  maximumFractionDigits:2
 });
}

function toast(msg){
 const el=document.getElementById("toast");
 if(!el)return;
 el.textContent=msg;
 el.classList.remove("hidden");
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>{
  el.classList.add("hidden");
 },2800);
}

function save(){
 try{
  localStorage.setItem("promvanta_state",JSON.stringify({
   user:state.user,
   campaigns:state.campaigns,
   transactions:state.transactions,
   wallet:state.wallet,
   tickets:state.tickets,
   referralCode:state.referralCode
  }));
 }catch(e){}
}

function load(){
 try{
  const x=JSON.parse(localStorage.getItem("promvanta_state"));
  if(x){
   state.user=x.user||null;
   state.campaigns=x.campaigns||[];
   state.transactions=x.transactions||[];
   state.wallet=x.wallet||0;
   state.tickets=x.tickets||[];
   state.referralCode=x.referralCode||"";
  }
 }catch(e){}
}

function go(screen){
 state.screen=screen;
 state.sidebar=false;
 window.scrollTo(0,0);
 render();
}

function logo(){
 return '<div class="logo">PROMV<span>ANTA</span></div>';
}

function openAuth(mode){
 state.authMode=mode;
 state.screen="auth";
 render();
}

 const register=state.authMode==="register";

 return `
 <div class="auth-wrap">
  <div class="auth-card">
   ${logo()}

   <h1>${register?"Create your PROMVANTA account":"Welcome back"}</h1>

   <div class="auth-actions">

   <p style="text-align:center;margin-top:22px">

     style="border:0;background:none;color:var(--primary);font-weight:800"
     onclick="state.authMode='${register?"login":"register"}';render()">
     ${register?"Sign in":"Create account"}
    </button>
   </p>
  </div>
 </div>`;
}

function submitAuth(){
 const email=document.getElementById("authEmail").value.trim();
 const pass=document.getElementById("authPass").value;

 if(!email||!pass){
  toast("Please complete the required fields.");
  return;
 }

 if(state.authMode==="register"){
  const name=document.getElementById("authName").value.trim();

  if(!name){
   toast("Please enter your name.");
   return;
  }

  state.user={name,email};
  state.referralCode=
   "PV-"+Math.random().toString(36).slice(2,10).toUpperCase();

  state.wallet=0;
  state.campaigns=[];
  state.transactions=[];
  state.tickets=[];

  save();
  toast("Account created successfully.");
 }else{
  if(!state.user){
   state.user={
    name:email.split("@")[0],
    email
   };

   state.referralCode=
    "PV-"+Math.random().toString(36).slice(2,10).toUpperCase();

   save();
  }

  toast("Signed in successfully.");
 }

 go("dashboard");
}

function forgot(){
 const email=prompt("Enter the email address for your password reset:");

 if(email){
  toast("Password reset request recorded.");
 }
}

function createPage(){
 const c=state.campaign;
 const types=Object.keys(services);
 const platforms=c.type?services[c.type].platforms:[];
 const goals=c.type?services[c.type].goals:[];
 const quantity=quantityGoals.includes(c.service);

 let price=0;

 if(quantity){
  price=Number(c.quantity||0)*10;
 }else{
  price=Number(c.budget||0);
 }

 return appShell(`
 <div class="page">

  <div class="page-title">
   <div>
    <h1>Create Campaign</h1>
    <p>Tell PROMVANTA what you want to achieve.</p>
   </div>
  </div>

  <div class="stepper">
   ${["Campaign","Destination","Goal","Price","Review"].map((x,i)=>`
    <span class="step-pill ${state.campaignStep===i+1?"active":""}">
     ${i+1}. ${x}
    </span>
   `).join("")}
  </div>

  <div class="panel">

   ${state.campaignStep===1?`
    <h3>1. Choose a campaign type</h3>
    <p class="help">Select the type that best describes what you want to promote.</p>

    <div class="form-grid" style="margin-top:20px">
     <div class="field full">
      <label>Campaign Type</label>
      <select
       id="ctype"
       onchange="
        state.campaign.type=this.value;
        state.campaign.platform='';
        state.campaign.service='';
        render()
       ">
       <option value="">Select campaign type</option>
       ${types.map(t=>`
        <option ${c.type===t?"selected":""}>${t}</option>
       `).join("")}
      </select>
     </div>
    </div>

   `:state.campaignStep===2?`

    <h3>2. Promotion destination</h3>

    <div class="form-grid" style="margin-top:20px">

     <div class="field">
      <label>Platform / Destination</label>
      <select id="cplatform">
       <option value="">Select destination</option>
       ${platforms.map(p=>`
        <option ${c.platform===p?"selected":""}>${p}</option>
       `).join("")}
      </select>
     </div>

     <div class="field">
      <label>Public promotion link</label>
      <input
       id="clink"
       value="${c.link}"
       placeholder="https://...">
     </div>

     <div class="field full">
      <div class="notice">
       Only public destinations that can be legitimately promoted should be submitted.
      </div>
     </div>

    </div>

   `:state.campaignStep===3?`

    <h3>3. What do you want to achieve?</h3>
    <p class="help">Only services applicable to your selected campaign are shown.</p>

    <div class="form-grid" style="margin-top:20px">

     <div class="field full">
      <label>Goal / Service</label>
      <select id="cservice" onchange="state.campaign.service=this.value;render()">
       <option value="">Select one goal</option>
       ${goals.map(g=>`
        <option ${c.service===g?"selected":""}>${g}</option>
       `).join("")}
      </select>
     </div>

     ${c.service
      ?quantity
       ?`
        <div class="field full">
         <label>Quantity Needed</label>
         <input
          id="qty"
          type="number"
          min="1"
          value="${c.quantity}"
          placeholder="Enter quantity">
        </div>

        <div class="field full">
         <div class="notice">
          PROMVANTA calculates the campaign price from the configured
          service/provider rate.
         </div>
        </div>
       `
       :`
        <div class="field full">
         <label>Campaign Budget</label>
         <input
          id="budget"
          type="number"
          min="2500"
          value="${c.budget}"
          placeholder="Enter campaign budget">
        </div>

        <div class="field full">
         <div class="notice">
          Budget-based campaigns use estimates rather than guaranteed results.
         </div>
        </div>
       `
      :""
     }
    </div>

   `:state.campaignStep===4?`

    <h3>4. Calculated price</h3>

    <div class="price-box">
     <div class="price-line">
      <span>Campaign goal</span>
      <strong>${c.service||"—"}</strong>
     </div>

     <div class="price-line">
      <span>${quantity?"Quantity":"Campaign budget"}</span>
      <strong>${quantity?(c.
      rate||0)*quantity:budget}</strong>
     </div>

     <div class="price-line">
      <span>Estimated campaign period</span>
      <strong>${c.duration||"Based on provider configuration"}</strong>
     </div>

     <div class="price-line total-line">
      <span>Total</span>
      <strong>₦${formatMoney(total)}</strong>
     </div>
    </div>

    ${total<2500?`
     <div class="alert warning">
      Minimum campaign value is ₦2,500. Please increase your requested quantity or adjust your campaign selection to continue.
     </div>
    `:""}

    <div class="step-actions">
     <button class="btn btn-secondary" onclick="prevCampaignStep()">Back</button>
     <button class="btn btn-primary" onclick="goToReview()" ${total<2500?"disabled":""}>
      Continue to Review
     </button>
    </div>

   `
        :state.campaignStep===5?`
    <h3>5. Review campaign</h3>

    <div class="review-box">

      <span>Campaign</span>
      <strong>${c.type||"—"}</strong>

     <div class="price-line">
      <span>Platform</span>
      <strong>${c.platform||"—"}</strong>
     </div>

     <div class="price-line">
      <span>Goal</span>
      <strong>${c.service||"—"}</strong>

     <div class="price-line">
      <span>Destination</span>
      <strong>${c.link||"—"}</strong>

      <strong>${quantity?quantity:"₦"+formatMoney(budget)}</strong>

      <span>Total</span>
      <strong>₦${formatMoney(total)}</strong>
     </div>
    </div>

    <div class="notice">

     Provider results will appear only when real provider data is available.
    </div>

    <div class="step-actions">
     <button class="btn btn-secondary" onclick="prevCampaignStep()">Back</button>

        :`
    <h3>Campaign creation</h3>
    <p class="muted">Complete the steps above to continue.</p>
   `
